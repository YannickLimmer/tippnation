name: Betfair odds polling

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the normal refresh cadence and fetch now"
        required: false
        default: false
        type: boolean
      all_upcoming:
        description: "With force, refresh every upcoming match instead of only the next stage"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: betfair-odds-polling
  cancel-in-progress: false

jobs:
  poll:
    name: Refresh market odds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TIPPNATION_SECRETS_TOML: ${{ secrets.TIPPNATION_SECRETS }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
      BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
      BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
      BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
      BETFAIR_SESSION: ${{ secrets.BETFAIR_SESSION }}
      BETFAIR_CERT_BASE64: ${{ secrets.BETFAIR_CERT_BASE64 }}
      BETFAIR_KEY_BASE64: ${{ secrets.BETFAIR_KEY_BASE64 }}
      BF_TOKEN: ${{ secrets.BF_TOKEN }}
      BF_SESSION: ${{ secrets.BF_SESSION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python sources
        run: python -m compileall app.py tippnation

      - name: Restore Betfair certs
        run: |
          set -euo pipefail
          if [[ -n "${BETFAIR_CERT_BASE64:-}" && -n "${BETFAIR_KEY_BASE64:-}" ]]; then
            python -c 'import base64, os; from pathlib import Path; decode=lambda value: base64.b64decode("".join(value.split()).replace("-", "+").replace("_", "/") + ("=" * ((-len("".join(value.split()).replace("-", "+").replace("_", "/"))) % 4)), validate=True); certs=Path("certs"); certs.mkdir(exist_ok=True); (certs / "betfair.crt").write_bytes(decode(os.environ["BETFAIR_CERT_BASE64"])); key=certs / "betfair.key"; key.write_bytes(decode(os.environ["BETFAIR_KEY_BASE64"])); key.chmod(0o600)'
            echo "BETFAIR_CERT_PATH=certs/betfair.crt" >> "$GITHUB_ENV"
            echo "BETFAIR_KEY_PATH=certs/betfair.key" >> "$GITHUB_ENV"
          fi

      - name: Poll Betfair and save odds
        run: |
          set -euo pipefail

          args=(--strict)
          if [[ "${{ github.event.inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi
          if [[ "${{ github.event.inputs.all_upcoming }}" == "true" ]]; then
            args+=(--all-upcoming)
          fi

          python -m tippnation.odds_cli "${args[@]}"
